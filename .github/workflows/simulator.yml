name: Simulator

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  physics-and-pros:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      CXX: g++
      QT_QPA_PLATFORM: offscreen
      EERSIM_RENDERER: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          micromamba-version: "2.9.0-0"
          init-shell: bash
          cache-environment: true
          post-cleanup: all
      - name: Check Git file sizes
        run: python tools/check_git_sizes.py
      - name: Install simulator
        # environment.yml supplies pytest and the validated Bullet build.
        # Resolving pip dependencies here would replace it with a newer solver.
        run: |
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Install Qt runtime library
        # QtGui links EGL even for import-only tests that create no window.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Verify physics environment
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path
          import sys
          from PySide6 import QtGui  # Import only; no QApplication or graphics context.
          records = [json.loads(path.read_text()) for path in (Path(sys.prefix) / "conda-meta").glob("pybullet-*.json")]
          assert len(records) == 1 and records[0]["version"] == "3.25", "CI must use environment.yml's conda-forge Bullet 3.25"
          for name in ("mujoco", "pybullet", "numpy", "PySide6", "vtk", "pytest"):
              print(f"{name}: {importlib.metadata.version(name)}")
          print(f"Conda Bullet build: {records[0]['build']}")
          PY
      - name: Test physics and native robot code
        run: python -m pytest tests -q
      - name: Build distributable package
        run: python -m pip wheel . --no-deps --wheel-dir dist
